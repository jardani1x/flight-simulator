name: Deploy to GitHub Pages

# Builds the Vite production bundle and publishes it to GitHub Pages.
#
# Prerequisite (one-time, in the repo UI): Settings → Pages → Source → "GitHub
# Actions". Until that is enabled the deploy job cannot publish.
#
# The site is built with `base: './'` (see vite.config.ts), so it works from the
# project-pages subpath: https://jardani1x.github.io/flight-simulator/

on:
  # Deploy whenever the default branch updates (e.g. when a feature branch is
  # merged into it), and allow manual runs from the Actions tab.
  push:
    branches: [claude/web-flight-simulator-mFBbg]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; let an in-progress run finish rather than
# cancelling it, so a published site is never left half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
